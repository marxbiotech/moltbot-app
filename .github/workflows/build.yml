name: Build and Push Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'image-extensions/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: version
        run: |
          set -euo pipefail
          repo=ghcr.io/marxbiotech/moltbot-app
          tag=$(grep '^FROM ghcr.io/' Dockerfile | head -1 | cut -d: -f2)
          sha_short=$(git rev-parse --short HEAD)

          # The fully-qualified tag is immutable and always published — it is
          # what deployments pin (alongside a digest).
          tags="$repo:$tag-$sha_short"

          # Floating tags only ever move from main. workflow_dispatch is how a
          # feature branch gets a testable image, and such a build must not
          # repoint :latest or the bare version tag for everyone else.
          if [ "${GITHUB_REF:-}" = "refs/heads/main" ]; then
            tags="$tags"$'\n'"$repo:latest"$'\n'"$repo:$tag"
          else
            echo "::notice::Branch build — publishing only $repo:$tag-$sha_short"
          fi

          {
            echo "tags<<TAGS_EOF"
            echo "$tags"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
