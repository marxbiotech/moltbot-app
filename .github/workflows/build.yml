name: Build and Push Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'extensions/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OpenClaw version from Dockerfile
        id: version
        run: |
          tag=$(grep '^FROM ghcr.io/openclaw/openclaw:' Dockerfile | cut -d: -f2)
          echo "openclaw_tag=$tag" >> "$GITHUB_OUTPUT"
          sha_short=$(git rev-parse --short HEAD)
          echo "sha_short=$sha_short" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/marxbiotech/moltbot-app:latest
            ghcr.io/marxbiotech/moltbot-app:${{ steps.version.outputs.openclaw_tag }}
            ghcr.io/marxbiotech/moltbot-app:${{ steps.version.outputs.openclaw_tag }}-${{ steps.version.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
